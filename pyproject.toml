[project]
name = "kanjian"
version = "0.1.0"
description = "Kànjiàn (看见): spoken descriptions of Chinese artworks for blind and low-vision visitors"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: runs the app in a real Chrome (skipped if none is available)"]
addopts = "-p no:cacheprovider"
filterwarnings = ["error::pytest.PytestUnknownMarkWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["tests/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Long lines are left to the formatter; interface sentences are allowed to run long.
ignore = ["E501"]
