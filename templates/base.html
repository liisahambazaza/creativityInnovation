<!doctype html>
<html lang="{{ html_lang }}" data-lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ t('app_name_full') }}{% endblock %}</title>
  <meta name="description" content="{{ t('tagline') }}">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/kanjian.css') }}">
  <script src="{{ url_for('static', filename='js/kanjian.js') }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">{{ t('skip') }}</a>

  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="{{ url_for('home') }}" aria-label="看见 Kànjiàn, {{ t('home') }}">
        <span class="brand-zh" lang="zh">看见</span>
        <span class="brand-en">Kànjiàn</span>
      </a>
      <nav class="site-nav" aria-label="{{ t('main_nav') }}">
        <ul>
          <li><a href="{{ url_for('home') }}"{% if request.endpoint in ('home', 'work') %} aria-current="page"{% endif %}>{{ t('nav_gallery') }}</a></li>
          <li><a href="{{ url_for('about') }}"{% if request.endpoint == 'about' %} aria-current="page"{% endif %}>{{ t('nav_about') }}</a></li>
        </ul>
      </nav>
      <nav class="lang-switch" aria-label="{{ t('language') }}">
        <ul>
          <li><a href="{{ lang_url('zh') }}" lang="zh" hreflang="zh"{% if lang == 'zh' %} aria-current="true"{% endif %}>中文</a></li>
          <li><a href="{{ lang_url('en') }}" lang="en" hreflang="en"{% if lang == 'en' %} aria-current="true"{% endif %}>English</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" tabindex="-1">
    {% block main %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>{{ t('footer_note') }} <a href="{{ url_for('about') }}">{{ t('nav_about') }}</a></p>
  </footer>

  <script type="application/json" id="kj-strings">{{ js_strings|tojson }}</script>
</body>
</html>
